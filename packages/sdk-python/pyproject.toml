[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ondari-sdk"
version = "0.1.0"
description = "Ondari Python SDK — send usage events and read back itemized, explainable costs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools]
packages = ["ondari"]
